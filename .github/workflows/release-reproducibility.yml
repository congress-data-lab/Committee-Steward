name: release-reproducibility

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bounded-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify citation metadata parses
        run: python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('CITATION.cff').read_text(encoding='utf-8'))"
      - name: Run bounded reproducibility fixtures
        run: |
          python -m pytest \
            tests/test_govinfo_manifest.py \
            tests/test_source_bundle.py \
            tests/test_reproduce.py \
            tests/test_release_export.py \
            tests/test_release_assembly.py \
            tests/test_release_validation.py \
            tests/test_docker_release.py \
            tests/test_release_tree.py \
            -q
      - name: Validate Docker Compose contract
        run: docker compose --env-file .env.example config --quiet
      - name: Note full replay policy
        run: |
          echo "Full replay stays manual or release-tag only."
          echo "Use local or frozen-bundle mode when you need a replay path without live MCP access."
          echo "See docs/REPRODUCING.md for the current commands and bounded CI coverage."
