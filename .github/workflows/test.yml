name: test

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repository tests
        run: python -m pytest tests -q

  bounded-release-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded reproducibility fixtures
        run: |
          python -m pytest \
            tests/test_govinfo_manifest.py \
            tests/test_source_bundle.py \
            tests/test_reproduce.py \
            tests/test_release_export.py \
            tests/test_release_assembly.py \
            tests/test_release_validation.py \
            tests/test_docker_release.py \
            tests/test_release_tree.py \
            -q
      - name: Validate Docker Compose contract
        run: docker compose --env-file .env.example config --quiet
